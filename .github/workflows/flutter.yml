name: Flutter checks

on: [push, pull_request]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.5'
      - shell: pwsh
        run: ./tool/generate_api.ps1 -Check
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
